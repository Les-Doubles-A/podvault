[package]
name = "podvault"
version = "0.3.0-alpha"
edition = "2021"
description = "PodVault — Gestionnaire de podcasts 100 % local pour Windows"
authors = ["Les-Doubles-A"]

[dependencies]
eframe = { version = "0.31", default-features = true }
egui = "0.31"
egui_extras = { version = "0.31", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "ico"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rodio = { version = "0.20", default-features = false, features = ["symphonia-all"] }
lofty = "0.22"
walkdir = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["clock"] }
rfd = "0.15"
directories = "5.0"
sha2 = "0.10"

[build-dependencies]
winres = "0.1"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
