org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# JDK 25 casse le compilateur Kotlin/KSP (JavaVersion.parse ne connaît pas
# le format "25.x") : il faut un JDK 17 pour builder ce projet.
#
# Ne PAS coder en dur org.gradle.java.home ici : le chemin dépend de la
# machine (OS, emplacement d'installation) et casse le build de tout le
# monde sauf celui qui l'a écrit. À la place, configurer le JDK utilisé par
# Gradle directement dans Android Studio :
#   Settings/Preferences > Build, Execution, Deployment > Build Tools
#   > Gradle > "Gradle JDK" -> choisir/télécharger un JDK 17
# (Android Studio propose de télécharger un JDK 17 embarqué si aucun n'est
# installé — c'est l'option la plus simple et elle marche sur toutes les
# machines.)
